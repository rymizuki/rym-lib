services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: seeder_test
      POSTGRES_PASSWORD: seeder_test
      POSTGRES_DB: seeder_test
    ports:
      - '127.0.0.1:5472:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U seeder_test -d seeder_test']
      interval: 2s
      timeout: 3s
      retries: 30
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: seeder_test
      MYSQL_DATABASE: seeder_test
      MYSQL_USER: seeder_test
      MYSQL_PASSWORD: seeder_test
    ports:
      - '127.0.0.1:3326:3306'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -pseeder_test']
      interval: 2s
      timeout: 3s
      retries: 60
